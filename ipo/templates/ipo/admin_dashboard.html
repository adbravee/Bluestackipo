{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Admin Dashboard</h2>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-building fs-1 text-primary mb-2"></i>
                <h5>Companies</h5>
                <a href="{% url 'company_list' %}" class="btn btn-outline-primary mt-2">Manage Companies</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-graph-up-arrow fs-1 text-primary mb-2"></i>
                <h5>IPOs</h5>
                <a href="{% url 'ipo_list' %}" class="btn btn-outline-primary mt-2">Manage IPOs</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-file-earmark-pdf fs-1 text-primary mb-2"></i>
                <h5>Documents</h5>
                <a href="{% url 'document_list' %}" class="btn btn-outline-primary mt-2">Manage Documents</a>
            </div>
        </div>
    </div>
    <div class="mt-5 text-end">
        <span class="me-3">Welcome, <strong>{{ user.username }}</strong></span>
        <a href="{% url 'custom_logout' %}" class="btn btn-danger">Logout</a>
    </div>
</div>
{% endblock %}
