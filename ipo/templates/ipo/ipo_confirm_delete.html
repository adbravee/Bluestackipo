{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Delete IPO</h2>
    <p>Are you sure you want to delete the IPO for <strong>{{ object.company.company_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'ipo_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
